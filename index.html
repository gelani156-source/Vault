<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1119"><meta name="apple-mobile-web-app-capable" content="yes"><title>VAULT — имущество и документы</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0c1119;--panel:#171f2c;--panel2:#202c3b;--text:#f3f7ff;--sub:#9dacbf;--blue:#389aff;--line:#2b384a;--good:#42d1a1;--warn:#ffc36a;--bad:#ff707f}*{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:var(--bg);color:var(--text);min-height:100svh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}main{max-width:820px;margin:auto;padding:22px 17px 120px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:22px;font-weight:900;letter-spacing:2px}.brand b{color:var(--blue)}.muted,.small{color:var(--sub)}.small{font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.hero{background:linear-gradient(140deg,#203d61,#132238 70%);border-color:#32517a}.hero .big{font-size:32px;font-weight:850;letter-spacing:-1px;margin:12px 0}.flex{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;border-radius:12px;background:#ffffff09}.stat strong{font-size:20px;display:block;margin-bottom:3px}.heading{font-size:19px;font-weight:800;margin:26px 0 12px}.btn{background:var(--blue);border:0;border-radius:13px;color:white;padding:13px 16px;font-weight:720}.btn.alt{background:#27384c;color:var(--text)}.btn.danger{background:#65313d;color:#ffdfe4}.btn.ghost{background:transparent;color:var(--blue)}.btn.sm{padding:8px 11px;font-size:12px}.btn.full{width:100%}.card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px;margin:9px 0;text-align:left;width:100%;color:var(--text)}.card .emoji{width:47px;height:47px;background:#233b55;border-radius:14px;display:grid;place-items:center;font-size:24px;flex-shrink:0}.card .info{flex:1;min-width:0}.card strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:11px;border-radius:99px;padding:4px 8px;background:#2c3e52;color:#c2d3e7;display:inline-block}.tag.warn{background:#513e21;color:#ffcf78}.tag.bad{background:#542a38;color:#ff9baa}.nav{position:fixed;bottom:0;left:0;right:0;z-index:3;background:#111a25ec;border-top:1px solid var(--line);padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;backdrop-filter:blur(14px)}.nav button{border:0;background:transparent;color:#8b9aad;padding:7px 8px;font-size:11px;display:grid;gap:4px;place-items:center}.nav button.active{color:#68b0ff}.nav .ico{font-size:22px}.nav .add{background:var(--blue);border-radius:17px;color:white;padding:6px 15px}.search{width:100%;padding:15px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;color:var(--text);outline:none}select,input,textarea{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:13px;color:var(--text);outline:none;min-width:0}textarea{min-height:84px;resize:vertical}label{display:grid;gap:7px;font-size:13px;color:var(--sub);margin:14px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.empty{color:var(--sub);text-align:center;padding:45px 16px;background:var(--panel);border-radius:18px}.modal-bg{position:fixed;inset:0;background:#02050bc9;z-index:10;display:flex;align-items:flex-end;justify-content:center}.modal{background:#131c29;border-radius:23px 23px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));width:100%;max-width:700px;max-height:94svh;overflow:auto}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.chip-row{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:12px}.chip.active{border-color:var(--blue);color:var(--blue)}.photo{width:100%;max-height:260px;object-fit:cover;border-radius:13px;margin:9px 0}.filelink{display:flex;justify-content:space-between;gap:8px;margin:7px 0;padding:11px;background:var(--panel2);border-radius:11px;align-items:center;word-break:break-word}h3{font-size:15px}.row-buttons{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:var(--sub);line-height:1.5}body.light{--bg:#f0f4fa;--panel:#fff;--panel2:#edf2f8;--text:#19283b;--sub:#65778f;--line:#d7e0ec}body.light .nav{background:#fffef0ee}body.light .hero{background:linear-gradient(140deg,#dceafa,#edf5ff)}body.light .stat{background:#ffffffa3}@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:24px;max-height:85vh}.grid-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px}}@media(max-width:380px){.grid{gap:5px}.stat{padding:8px}.stat strong{font-size:16px}}
</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><div id="modal-root"></div><script>
"use strict";
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n)||0);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;
const categories=['Техника','Дом','Инструменты','Одежда','Транспорт','Прочее'];
const icons={'Техника':'💻','Дом':'🏠','Инструменты':'🛠️','Одежда':'🧥','Транспорт':'🚲','Прочее':'📦'};
let page='home',filter='',query='',db=null,items=[],docs=[],maint=[],settings={theme:'dark',currency:'₽'};
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('vault-local-v1',1);req.onupgradeneeded=()=>{for(let name of ['items','docs','maintenance','settings'])if(!req.result.objectStoreNames.contains(name))req.result.createObjectStore(name,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function request(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
const all=store=>request(tx(store).getAll());
const put=(store,value)=>request(tx(store,'readwrite').put(value));
const del=(store,id)=>request(tx(store,'readwrite').delete(id));
async function reload(){[items,docs,maint]=await Promise.all(['items','docs','maintenance'].map(all));const s=await request(tx('settings').get('main'));settings=s?{...settings,...s}:settings;document.body.classList.toggle('light',settings.theme==='light');render()}
function expiry(item){return item.warrantyEnd||''}
function days(date){if(!date)return null;const a=new Date(`${date}T12:00:00`),b=new Date(`${today()}T12:00:00`);return Math.round((a-b)/86400000)}
function status(item){let d=days(expiry(item));return d===null?'Без гарантии':d<0?'Гарантия истекла':d<=30?`Осталось ${d} дн.`:'Гарантия действует'}
function urgent(){return items.filter(x=>{let d=days(expiry(x));return d!==null&&d<=30}).sort((a,b)=>a.warrantyEnd.localeCompare(b.warrantyEnd))}
function money(n){return `${fmt(n)} ${settings.currency}`}
const itembtn=x=>`<button class="card" data-open="${escapeHTML(x.id)}"><span class="emoji">${icons[x.category]||'📦'}</span><span class="info"><strong>${escapeHTML(x.name)}</strong><span class="small">${escapeHTML([x.brand,x.model].filter(Boolean).join(' · ')||x.category)}</span><br><span class="tag ${days(x.warrantyEnd)!==null&&days(x.warrantyEnd)<0?'bad':days(x.warrantyEnd)!==null&&days(x.warrantyEnd)<=30?'warn':''}">${escapeHTML(status(x))}</span></span><span style="font-weight:700;white-space:nowrap">${money(x.price)}</span></button>`;
function home(){const total=items.filter(x=>x.status!=='Продано'&&x.status!=='Списано').reduce((s,x)=>s+(Number(x.price)||0),0);const due=urgent();return `<div class="panel hero"><span class="small">СТОИМОСТЬ ПОКУПОК В УЧЁТЕ</span><div class="big">${money(total)}</div><div class="grid"><div class="stat"><strong>${items.length}</strong><span class="small">Вещей</span></div><div class="stat"><strong>${docs.length}</strong><span class="small">Файлов</span></div><div class="stat"><strong>${due.length}</strong><span class="small">Внимание</span></div></div></div><div class="flex"><h2 class="heading">Требуют внимания</h2><button class="btn ghost sm" data-page="events">Все сроки →</button></div>${due.length?due.slice(0,3).map(itembtn).join(''):'<div class="panel small">Срочных гарантийных событий нет</div>'}<div class="flex"><h2 class="heading">Недавно добавлено</h2><button class="btn ghost sm" data-page="items">Каталог →</button></div>${items.length?items.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,5).map(itembtn).join(''):'<div class="empty">Добавь первую вещь, чтобы начать каталог</div>'}<button class="btn full" data-add="item">＋ Добавить имущество</button>`}
function itemsPage(){const found=items.filter(x=>`${x.name} ${x.brand} ${x.model} ${x.serial} ${x.location} ${x.category}`.toLowerCase().includes(query.toLowerCase())&&(!filter||x.category===filter));return `<h2 class="heading">Моё имущество <span class="small">(${items.length})</span></h2><input class="search" id="search" placeholder="Поиск: название, модель, серийный номер…" value="${escapeHTML(query)}"><div class="chip-row" style="margin-top:12px"><button class="chip ${!filter?'active':''}" data-filter="">Все</button>${categories.map(x=>`<button class="chip ${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="grid-list" style="margin-top:14px">${found.length?found.map(itembtn).join(''):'<div class="empty">Ничего не найдено</div>'}</div>`}
function docsPage(){return `<div class="flex"><h2 class="heading">Документы <span class="small">(${docs.length})</span></h2><button class="btn sm" data-add="doc">＋ Файл</button></div>${docs.length?docs.map(d=>`<div class="filelink"><span>📄 <strong>${escapeHTML(d.name)}</strong><br><span class="small">${escapeHTML(items.find(x=>x.id===d.itemId)?.name||'Без привязки')} · ${Math.round((d.size||0)/1024)} КБ</span></span><span class="row-buttons"><button class="btn alt sm" data-viewdoc="${escapeHTML(d.id)}">Открыть</button><button class="btn danger sm" data-deldoc="${escapeHTML(d.id)}">✕</button></span></div>`).join(''):'<div class="empty">Добавь чеки, инструкции и гарантийные талоны</div>'}` }
function eventsPage(){let warr=items.filter(x=>x.warrantyEnd).map(x=>({type:'Гарантия',name:x.name,date:x.warrantyEnd,itemId:x.id}));let srv=maint.filter(x=>x.nextDate).map(x=>({type:'Обслуживание',name:items.find(i=>i.id===x.itemId)?.name||'Вещь удалена',date:x.nextDate,itemId:x.itemId}));const list=[...warr,...srv].sort((a,b)=>a.date.localeCompare(b.date));return `<h2 class="heading">Сроки и обслуживание</h2><div class="panel small">Здесь отображаются гарантии и запланированные работы. Для напоминаний вне приложения можно добавить событие в календарь.</div>${list.length?list.map(x=>`<button class="card" data-open="${escapeHTML(x.itemId)}"><span class="emoji">${x.type==='Гарантия'?'🛡️':'🔧'}</span><span class="info"><strong>${escapeHTML(x.name)}</strong><span class="small">${x.type} · ${escapeHTML(x.date)}</span></span><span class="tag ${days(x.date)<0?'bad':days(x.date)<=30?'warn':''}">${days(x.date)<0?'Просрочено':`Через ${days(x.date)} дн.`}</span></button>`).join(''):'<div class="empty">Пока нет событий</div>'}` }
function morePage(){return `<h2 class="heading">Настройки</h2><div class="panel"><h3>Оформление</h3><div class="flex"><span>Светлая тема</span><button class="btn alt" data-theme>${settings.theme==='light'?'Включена':'Выключена'}</button></div><h3>Валюта покупок</h3><p class="hint">Суммы показываются в одной выбранной валюте; конвертации между валютами нет.</p><select id="currency"><option value="₽" ${settings.currency==='₽'?'selected':''}>Рубли ₽</option><option value="€" ${settings.currency==='€'?'selected':''}>Евро €</option><option value="$" ${settings.currency==='$'?'selected':''}>Доллары $</option></select></div><div class="panel"><h3>Резервные копии</h3><p class="hint">Экспорт включает карточки, документы с вложениями и историю обслуживания. Храни копию в надёжном месте.</p><div class="row-buttons"><button class="btn" data-backup>Скачать резервную копию</button><button class="btn alt" data-import>Восстановить</button></div></div><div class="panel"><h3>О приложении</h3><p class="small">VAULT 1.0 · local-first · данные остаются в браузере на этом устройстве. Отсутствует облачная синхронизация и шифрование локальной базы.</p></div>`}
function render(){ $('#app').innerHTML=`<div class="top"><div class="brand">⬡ <b>VAULT</b></div><button class="btn alt sm" data-add="item">＋ Добавить</button></div>${({home,items:itemsPage,docs:docsPage,events:eventsPage,more:morePage})[page]()}<input type="file" hidden id="backupFile" accept="application/json,.json"><input type="file" hidden id="docFile" accept="image/*,application/pdf,.pdf" multiple>`;$('#nav').innerHTML=[['home','⌂','Главная'],['items','▦','Имущество'],['add','＋','Добавить'],['docs','▤','Документы'],['events','◷','Сроки'],['more','⚙','Ещё']].map(([p,i,t])=>`<button class="${p===page?'active':''} ${p==='add'?'add':''}" data-page="${p}"><span class="ico">${i}</span>${t}</button>`).join('');if(page==='items'){$('#search').addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)})}if(page==='more')$('#currency').onchange=async e=>{settings.currency=e.target.value;await put('settings',{...settings,id:'main'});reload()}}
function modal(html){$('#modal-root').innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`}
function close(){ $('#modal-root').innerHTML='' }
const head=t=>`<div class="modal-head"><h2>${t}</h2><button class="btn alt sm" data-close>✕</button></div>`;
const field=(label,name,value='',type='text')=>`<label>${label}<input name="${name}" type="${type}" value="${escapeHTML(value??'')}"></label>`;
function editItem(id){let x=items.find(i=>i.id===id)||{};modal(head(id?'Редактировать вещь':'Новая вещь')+`<form id="itemForm">${field('Название *','name',x.name)}<div class="form-grid">${field('Бренд','brand',x.brand)}${field('Модель','model',x.model)}</div><div class="form-grid"><label>Категория<select name="category">${categories.map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></label>${field('Стоимость покупки','price',x.price||'','number')}</div><div class="form-grid">${field('Дата покупки','purchase',x.purchase,'date')}${field('Гарантия до','warrantyEnd',x.warrantyEnd,'date')}</div>${field('Серийный номер','serial',x.serial)}${field('Место хранения','location',x.location)}<label>Состояние<select name="status">${['В использовании','На хранении','Продано','Списано'].map(c=>`<option ${x.status===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Заметки<textarea name="notes">${escapeHTML(x.notes||'')}</textarea></label><button class="btn full" type="submit">${id?'Сохранить изменения':'Добавить вещь'}</button></form>`);$('#itemForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.name.trim())return alert('Укажи название');d.price=Number(d.price)||0;if(d.price<0)return alert('Стоимость не может быть отрицательной');await put('items',{...x,...d,id:id||uid(),created:x.created||new Date().toISOString()});close();await reload();};}
function itemDetail(id){let x=items.find(i=>i.id===id);if(!x)return;const files=docs.filter(d=>d.itemId===id),services=maint.filter(m=>m.itemId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));modal(head(escapeHTML(x.name))+`<p class="small">${escapeHTML([x.brand,x.model,x.serial].filter(Boolean).join(' · '))}</p><div class="panel hero"><div class="big">${money(x.price)}</div><span class="tag">${escapeHTML(x.category)}</span> <span class="tag">${escapeHTML(x.status)}</span><p class="small">Покупка: ${escapeHTML(x.purchase||'—')} · Гарантия: ${escapeHTML(x.warrantyEnd||'—')}</p><p class="small">Место: ${escapeHTML(x.location||'—')}</p></div>${x.notes?`<p>${escapeHTML(x.notes)}</p>`:''}<div class="row-buttons"><button class="btn sm" data-edit="${id}">Редактировать</button><button class="btn alt sm" data-attach="${id}">＋ Документ</button><button class="btn alt sm" data-maint="${id}">＋ Обслуживание</button><button class="btn danger sm" data-delete="${id}">Удалить</button></div><h3>Документы</h3>${files.length?files.map(d=>`<div class="filelink">${escapeHTML(d.name)} <button class="btn alt sm" data-viewdoc="${d.id}">Открыть</button></div>`).join(''):'<p class="small">Вложений нет</p>'}<h3>Обслуживание</h3>${services.length?services.map(m=>`<div class="filelink"><span>${escapeHTML(m.date)} · ${escapeHTML(m.title)}<br><span class="small">${money(m.cost)}${m.nextDate?' · Следующее: '+escapeHTML(m.nextDate):''}</span></span><button class="btn danger sm" data-delmaint="${m.id}">✕</button></div>`).join(''):'<p class="small">Записей нет</p>'}`)}
function serviceForm(id){modal(head('Обслуживание')+`<form id="serviceForm">${field('Что сделано *','title')}${field('Дата','date',today(),'date')}${field('Стоимость','cost',0,'number')}${field('Следующая дата (необязательно)','nextDate','','date')}<button class="btn full">Сохранить</button></form>`);$('#serviceForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!v.title.trim())return alert('Укажи работу');v.cost=Number(v.cost)||0;if(v.cost<0)return alert('Недопустимая стоимость');await put('maintenance',{...v,id:uid(),itemId:id});close();await reload();itemDetail(id)}}
function docForm(itemId=''){modal(head('Добавить документ')+`<form id="docForm"><label>Файл (PDF или изображение)<input type="file" name="file" accept="application/pdf,image/*" required></label><label>Привязать к вещи<select name="itemId"><option value="">Без привязки</option>${items.map(x=>`<option value="${escapeHTML(x.id)}" ${itemId===x.id?'selected':''}>${escapeHTML(x.name)}</option>`).join('')}</select></label><button class="btn full">Сохранить документ</button></form><p class="hint">Файлы хранятся локально. Для больших архивов обязательно делай резервные копии.</p>`);$('#docForm').onsubmit=async e=>{e.preventDefault();const f=e.target.elements.file.files[0];if(!f)return;if(f.size>12*1024*1024)return alert('Максимальный размер файла 12 МБ');if(!['application/pdf','image/png','image/jpeg','image/webp','image/heic','image/heif'].includes(f.type))return alert('Поддерживаются PDF и изображения');let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)});try{await put('docs',{id:uid(),name:f.name,mime:f.type,data,size:f.size,itemId:e.target.elements.itemId.value,created:new Date().toISOString()});close();reload()}catch(err){alert('Не удалось сохранить документ: '+err.message)}}}
function viewDoc(id){let d=docs.find(x=>x.id===id);if(!d)return;const a=document.createElement('a');a.href=d.data;a.download=d.name;document.body.append(a);a.click();a.remove()}
async function downloadBackup(){const backup={format:'vault-backup',version:1,exported:new Date().toISOString(),data:{items,docs,maintenance:maint,settings:[{...settings,id:'main'}]}};let blob=new Blob([JSON.stringify(backup)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`VAULT-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function restoreBackup(f){let b;try{b=JSON.parse(await f.text());if(b.format!=='vault-backup'||b.version!==1||!b.data||!['items','docs','maintenance','settings'].every(x=>Array.isArray(b.data[x])))throw Error('Неверный формат архива');for(const name of ['items','docs','maintenance','settings'])for(const x of b.data[name])if(!x||typeof x.id!=='string')throw Error('Неверная запись '+name);if(!confirm('Заменить ВСЕ текущие данные содержимым архива? Сначала сохрани резервную копию.'))return;for(const name of ['items','docs','maintenance','settings']){const t=db.transaction(name,'readwrite'),s=t.objectStore(name);s.clear();for(const x of b.data[name])s.put(x);await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)})}await reload();alert('Архив восстановлен')}catch(e){alert('Не удалось восстановить: '+e.message)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset;if('close'in a){close();return}if(a.page){if(a.page==='add')editItem();else{page=a.page;render()}return}if('add'in a){a.add==='doc'?docForm():editItem();return}if('filter'in a){filter=a.filter;render();return}if(a.open){itemDetail(a.open);return}if(a.edit){editItem(a.edit);return}if(a.attach!==undefined){docForm(a.attach);return}if(a.maint){serviceForm(a.maint);return}if(a.viewdoc){viewDoc(a.viewdoc);return}if(a.delete){if(confirm('Удалить вещь? Связанные документы останутся без привязки.')){for(const d of docs.filter(x=>x.itemId===a.delete))await put('docs',{...d,itemId:''});for(const m of maint.filter(x=>x.itemId===a.delete))await del('maintenance',m.id);await del('items',a.delete);close();reload()}return}if(a.deldoc){if(confirm('Удалить документ?')){await del('docs',a.deldoc);close();reload()}return}if(a.delmaint){if(confirm('Удалить запись обслуживания?')){await del('maintenance',a.delmaint);close();reload()}return}if('theme'in a){settings.theme=settings.theme==='dark'?'light':'dark';await put('settings',{...settings,id:'main'});reload();return}if('backup'in a){downloadBackup();return}if('import'in a){$('#backupFile').click();return}});
document.addEventListener('change',e=>{if(e.target.id==='backupFile'&&e.target.files[0])restoreBackup(e.target.files[0])});
(async()=>{try{db=await openDB();await reload()}catch(err){$('#app').innerHTML=`<h2>Ошибка хранилища</h2><p>${escapeHTML(err.message)}</p><p>Открой приложение по HTTPS в Safari или другом современном браузере.</p>`}})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
